<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Sửa chủ đề - Hệ thống Quản trị</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="form-container">
        <div class="form-title">Sửa chủ đề: {{ key }}</div>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="flash">{{ messages[0] }}</div>
          {% endif %}
        {% endwith %}
        <form method="post">
            <label for="ten">Tên chủ đề</label>
            <input type="text" id="ten" name="ten" value="{{ lesson.ten }}" required>

            <hr style="margin: 20px 0;">
            <div id="custom-properties">
                {% for k, v in lesson.items() %}
                    {% if k != 'ten' %}
                    <div class="property-group" style="margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px;">
                        <label>Tên mục</label>
                        <input type="text" name="custom_key[]" value="{{ k }}" required>
                        <label>Nội dung</label>
                        <textarea name="custom_val[]" rows="4">{{ v }}</textarea>
                        <button type="button" onclick="this.parentElement.remove()" style="background:#d32f2f; color:#fff; border:none; border-radius:4px; padding:4px 10px; cursor:pointer; margin-top:5px;">Xóa mục này</button>
                    </div>
                    {% endif %}
                {% endfor %}
            </div>
            
            <button type="button" id="add-prop-btn" class="form-btn" style="background:#388e3c; margin-bottom: 20px;">+ Thêm mục mới</button>
            <button class="form-btn" type="submit">Lưu thay đổi</button>
        </form>
        <a class="back-link" href="{{ url_for('admin_dashboard') }}">← Quay lại quản trị</a>
    </div>

    <script>
        document.getElementById('add-prop-btn').addEventListener('click', function() {
            const container = document.getElementById('custom-properties');
            const newDiv = document.createElement('div');
            newDiv.className = 'property-group';
            newDiv.style.marginBottom = '15px';
            newDiv.style.borderBottom = '1px solid #eee';
            newDiv.style.paddingBottom = '10px';
            newDiv.innerHTML = `
                <label>Tên mục</label>
                <input type="text" name="custom_key[]" placeholder="Tên mục..." required>
                <label>Nội dung</label>
                <textarea name="custom_val[]" placeholder="Nội dung mục..." rows="4"></textarea>
                <button type="button" onclick="this.parentElement.remove()" style="background:#d32f2f; color:#fff; border:none; border-radius:4px; padding:4px 10px; cursor:pointer; margin-top:5px;">Xóa mục này</button>
            `;
            container.appendChild(newDiv);
        });
    </script>
</body>
</html>
