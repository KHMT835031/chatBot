<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - ChatBot {{ get_current_grade_name() }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="login-container">
        <div class="login-title">Đăng nhập</div>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="flash">{{ messages[0] }}</div>
          {% endif %}
        {% endwith %}
        <form class="login-form" method="post">
            <label for="username">Tên đăng nhập</label>
            <input type="text" id="username" name="username" required autofocus>
            <label for="password">Mật khẩu</label>
            <input type="password" id="password" name="password" required>
            <button type="submit">Đăng nhập</button>
        </form>
        <a class="login-link" href="{{ url_for('register') }}">Chưa có tài khoản? Đăng ký</a>
        <a class="login-link" href="{{ url_for('forgot_password') }}">Quên mật khẩu?</a>
        <a class="login-link" href="{{ url_for('index') }}" style="color: #666; margin-top: 25px; display: block; text-decoration: none;">← Quay lại trang chủ</a>
    </div>
</body>
</html>
