<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thêm chủ đề - ChatBot Tin học 9</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="form-container">
        <div class="form-title">Thêm chủ đề mới</div>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="flash">{{ messages[0] }}</div>
          {% endif %}
        {% endwith %}
        <form method="post">
            <label for="key">Key (ví dụ: chu_de_7)</label>
            <input type="text" id="key" name="key" required>
            <label for="ten">Tên chủ đề</label>
            <input type="text" id="ten" name="ten" required>
            <label for="vidu">Ví dụ (mỗi dòng 1 ví dụ)</label>
            <textarea id="vidu" name="vidu"></textarea>
            <label for="noidung_1">Nội dung 1</label>
            <textarea id="noidung_1" name="noidung_1"></textarea>
            <label for="noidung_2">Nội dung 2</label>
            <textarea id="noidung_2" name="noidung_2"></textarea>
            <label for="noidung_3">Nội dung 3</label>
            <textarea id="noidung_3" name="noidung_3"></textarea>
            <label for="noidung_4">Nội dung 4</label>
            <textarea id="noidung_4" name="noidung_4"></textarea>
            <label for="noidung_5">Nội dung 5</label>
            <textarea id="noidung_5" name="noidung_5"></textarea>
            <button class="form-btn" type="submit">Thêm chủ đề</button>
        </form>
        <a class="back-link" href="{{ url_for('admin_dashboard') }}">← Quay lại quản trị</a>
    </div>
</body>
</html>
