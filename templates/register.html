<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký - ChatBot Tin học 9</title>
    <style>
        body { background: #f6f6f6; font-family: Arial, sans-serif; margin: 0; }
        .register-container {
            max-width: 370px;
            margin: 60px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
            padding: 32px 28px 24px 28px;
        }
        .register-title {
            text-align: center;
            font-size: 22px;
            color: #1976d2;
            font-weight: bold;
            margin-bottom: 18px;
        }
        .register-form label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-size: 15px;
        }
        .register-form input[type="text"], .register-form input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 16px;
            border: 1px solid #bdbdbd;
            border-radius: 7px;
            font-size: 15px;
        }
        .register-form button {
            width: 100%;
            padding: 10px;
            background: #1976d2;
            color: #fff;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 6px;
        }
        .register-form button:hover {
            background: #1565c0;
        }
        .register-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #1976d2;
            text-decoration: none;
            font-size: 15px;
        }
        .flash {
            color: #d32f2f;
            text-align: center;
            margin-bottom: 12px;
            font-size: 15px;
        }
        @media (max-width: 600px) {
            .register-container {
                max-width: 98vw;
                padding: 14px 4px 10px 4px;
            }
            .register-title {
                font-size: 17px;
            }
            .register-form label, .register-link, .flash {
                font-size: 13px;
            }
            .register-form input, .register-form button {
                font-size: 14px;
                padding: 8px 8px;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-title">Đăng ký tài khoản</div>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="flash">{{ messages[0] }}</div>
          {% endif %}
        {% endwith %}
        <form class="register-form" method="post">
            <label for="username">Tên đăng nhập</label>
            <input type="text" id="username" name="username" required autofocus>
            <label for="password">Mật khẩu</label>
            <input type="password" id="password" name="password" required>
            <button type="submit">Đăng ký</button>
        </form>
        <a class="register-link" href="{{ url_for('login') }}">Đã có tài khoản? Đăng nhập</a>
    </div>
</body>
</html>
