<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cấu hình hệ thống - ChatBot Tin học 9</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="config-container">
        <div class="config-title">Cấu hình hệ thống</div>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="flash">{{ messages[0] }}</div>
          {% endif %}
        {% endwith %}
        <form method="post">
            <label for="API_KEY">API Key Gemini</label>
            <input type="text" id="API_KEY" name="API_KEY" value="{{ config.API_KEY }}" required>
            <label for="MAX_TOKEN">Giới hạn token (MAX_TOKEN)</label>
            <input type="number" id="MAX_TOKEN" name="MAX_TOKEN" value="{{ config.MAX_TOKEN }}" min="512" max="4096" required>
            <button class="form-btn" type="submit">Lưu cấu hình</button>
        </form>
        <a class="back-link" href="{{ url_for('admin_dashboard') }}">← Quay lại quản trị</a>
    </div>
</body>
</html>
